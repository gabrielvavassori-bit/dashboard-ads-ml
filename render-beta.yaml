# Blueprint separado para ambiente beta do Dashboard ADS.
# Nao altera o servico principal ja em producao.
# Use este arquivo para criar um segundo web service no Render.
services:
  - type: web
    name: dashboard-ads-ml-beta
    runtime: python
    plan: starter
    region: oregon
    pythonVersion: "3.12"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    healthCheckPath: /healthz
    autoDeploy: false
    disk:
      name: dashboard-beta-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BETA_MODE
        value: "true"
      - key: BETA_REJECT_BILLING_WEBHOOKS
        value: "true"
      - key: BETA_ALLOWED_EMAILS
        sync: false
      - key: BETA_SHARED_AUTH_URL
        sync: false
      - key: BETA_SHARED_AUTH_SECRET
        sync: false
      - key: BETA_PUBLIC_URL
        sync: false
      - key: BETA_SHARED_ML_URL
        value: https://agente-ml.onrender.com
      - key: DATA_DIR
        value: /var/data
      - key: APP_PUBLIC_URL
        sync: false
      - key: AGENTE_ML_BASE_URL
        value: https://agente-ml.onrender.com
      - key: DASH_ADS_INTERNAL_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_ACCESS_DAYS
        value: "7"
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: MAX_PARALLEL_DASHBOARDS
        value: "2"
