name: Critical regressions

on:
  pull_request:
  push:
    branches: [main]

jobs:
  regression-001-dash-ads-financial-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: REGRESSION-001
        env:
          RODAR_SCHEDULER: "0"
        run: python -m unittest -v test_regression_001_snapshot_integrity.py
