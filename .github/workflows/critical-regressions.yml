name: Critical regressions

on:
  pull_request:
  push:

jobs:
  regression-001-dash-ads-snapshot-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: REGRESSION-001
        env:
          RODAR_SCHEDULER: "0"
        run: >-
          python -m unittest -v
          test_regression_001_snapshot_integrity.py
          test_online_periods.OnlinePeriodTests.test_online_integrity_blocks_when_central_rule_cannot_be_consulted
          test_online_periods.OnlinePeriodTests.test_online_builder_blocks_partial_ads_coverage_before_financial_rendering
          test_online_periods.OnlinePeriodTests.test_online_builder_blocks_when_daily_sales_coverage_turns_partial
          test_online_periods.OnlinePeriodTests.test_online_builder_blocks_daily_ads_without_explicit_complete_coverage
          test_online_periods.OnlinePeriodTests.test_online_builder_never_renders_a_completed_snapshot_from_another_period
          test_online_periods.OnlinePeriodTests.test_online_builder_reports_pending_when_no_snapshot_is_available
          test_online_periods.OnlinePeriodTests.test_sales_intelligence_blocks_daily_partial_coverage_before_recommendations
          test_online_periods.OnlinePeriodTests.test_never_sold_listing_requires_active_status_and_creation_coverage
          test_integrations.HTTPRouteTests.test_online_integrity_block_hides_financial_kpis_exports_and_auto_refresh
          test_integrations.HTTPRouteTests.test_online_repair_pending_retries_without_rendering_financial_values
          test_integrations.HTTPRouteTests.test_online_dashboard_blocks_partial_sales_before_calculating_kpis
          test_integrations.HTTPRouteTests.test_sales_intelligence_integrity_block_hides_online_recommendations
